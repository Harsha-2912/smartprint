# Render Blueprint Specification for SmartPrint AI (Frontend + Backend ONLY)
# Database is omitted so you can attach your own manually created database.
# Docs: https://render.com/docs/blueprint-spec

services:
  # ========================================================
  # 1. BACKEND SERVICE: Python Flask REST API Engine
  # ========================================================
  - type: web
    name: smartprint-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "False"
      - key: HOST
        value: 0.0.0.0
      - key: KIOSK_ID
        value: KIOSK-CLOUD-01
      # Connect your manual database by setting this in Render Dashboard:
      - key: DATABASE_URL
        sync: false

  # ========================================================
  # 2. FRONTEND SERVICE: React 19 + Vite Static Site
  # ========================================================
  - type: web
    name: smartprint-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ENABLE_MOCK_FALLBACK
        value: "true"
      # Point this to your backend URL in Render Dashboard (e.g. https://smartprint-backend.onrender.com/api):
      - key: VITE_API_BASE_URL
        sync: false
